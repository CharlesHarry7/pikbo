name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine · lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======)' -- app lib components scripts docs 2>/dev/null; then
            echo "Conflict markers found"
            exit 1
          fi
          echo "No conflict markers"

      - name: Engine smoke
        run: npm run engine-smoke

      - name: Recovery QA (R0–R3 cost · ledger · CI honesty)
        run: npm run recovery-qa

      - name: Recovery ledger (R1a atomic reserve/capture fixture)
        run: npm run recovery-ledger

      - name: T5 auth + durable credits pure engine
        run: npm run t5-auth-credits-smoke

      - name: T5 + R0 critical path (refund · idempotency · auth fail-closed)
        run: npm run t5-r0-critical-path

      - name: P0 private object settlement + provider budget
        run: |
          npm run p0-private-live-generation
          npm run generate-wait-honesty-regression
          npm run durable-library-statuses-regression
          npm run provider-budget-regression
          npm run capability-matrix

      - name: P1 atomic Launch Pack (30 once · three bound children)
        run: npm run seller-pack-atomic-regression

      - name: Private toy input · Pack discovery · auth return path
        run: |
          npm run private-toy-input-pack-regression
          npm run direct-moment-input-binding-regression
          npm run auth-magic-link-regression

      - name: Stripe billing (paid binding · event ordering · credit idempotency)
        run: npm run stripe-billing-regression

      - name: Privacy analytics (six-event funnel · no sensitive payloads)
        run: npm run privacy-analytics-regression

      - name: R0 reservation safety-net (behavioral)
        run: npm run r0-safety-net

      - name: Recovery retry + deadline (R1b video + image)
        run: npm run recovery-retry-deadline

      - name: Showcase evidence honesty
        run: npm run showcase-evidence-smoke

      - name: SEO cold-start five-page budget
        run: npm run seo-cold-start-smoke

      - name: Seller Pack cached golden path
        run: npm run seller-pack-cached-smoke

      - name: Launch Pack product and mobile contracts
        run: |
          npm run launch-pack-main-path-smoke
          npm run product-proof-smoke
          npm run guest-create-preview-regression
          npm run studio-open-lab-preview-regression
          npm run mobile-proof-regression

      - name: T6 owned watermark delivery proof
        run: npm run t6-deliverable-proof

      - name: Recovery reconciliation (R1c lease + settlement replay)
        run: |
          npm run recovery-reconciliation
          npm run generation-reconciliation-worker-regression

      - name: Public capability copy source contract
        run: npm run live-copy-smoke

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Public capability copy rendered contract
        run: npm run live-copy-smoke -- --require-rendered

      # Server must stay in the SAME step as link/critical checks
      # (background processes do not survive across GitHub Actions steps).
      - name: Prod server · link-check · critical-path
        run: |
          set -euo pipefail
          npm run start -- --port 3456 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3456/api/health >/dev/null; then
              echo "server up on :3456"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server process died before ready"
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 90 ]; then
              echo "server failed to become healthy"
              exit 1
            fi
          done

          export BASE_URL="http://127.0.0.1:3456"
          npm run link-check
          # R3: critical-path fails the job. Demo-cached is the default gate
          # (ready.demo); soft-live only when REQUIRE_SOFT_LIVE=1.
          npm run critical-path
          # Seller Pack running-server cached trio (no FAL_KEY in CI).
          PIKBO_BASE="http://127.0.0.1:3456" npm run seller-pack-api-golden
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PORT: "3456"

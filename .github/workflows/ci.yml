name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine · lint · typecheck · build · critical-path
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======)' -- app lib components scripts docs 2>/dev/null; then
            echo "Conflict markers found"
            exit 1
          fi
          echo "No conflict markers"

      - name: Engine smoke
        run: npm run engine-smoke

      - name: Durable credits smoke
        run: npm run durable-credits-smoke

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # P0-1: Start prod server + link-check + critical-path in ONE step.
      # No || true — server down / link fail / critical path fail → red CI.
      - name: Prod server + link-check + critical-path
        run: |
          set -euo pipefail
          npm run start -- --port 3456 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:3456/api/health >/dev/null; then
              echo "server up after ${i}s"
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "server process exited before ready"
              exit 1
            fi
            if [ "$i" -eq 90 ]; then
              echo "server failed to start within 90s"
              exit 1
            fi
            sleep 1
          done

          BASE_URL=http://127.0.0.1:3456 npm run link-check
          BASE_URL=http://127.0.0.1:3456 npm run critical-path
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PORT: "3456"
          # Demo-cached acceptance — no secrets required for critical-path
          # (script must pass honestly without masking failures)
